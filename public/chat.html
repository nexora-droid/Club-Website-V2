<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Support</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="main">
        <div id="nav">
            <h1 href="#hero" id="nav-title">NOVA Support</h1>
            <div id="nav-links">
                <a href="/">Home Page</a>
                <a href="/members">Dashboard</a>
            </div>
        </div>
        <div id="hero">
            <h1>Chat with NOVA Support</h1>
        </div>
        <div id="chat">
            <div id="messages">
                <div class="aimsgcard">
                    <p class="ainame">Apodex 1.1</p>
                    <p class="aimsg">Hi! How can I help you today?</p>
                </div>
            </div>
            <form id="sendMsg">
                <input type="text" placeholder="Ask Away" id="msgText">
                <button type="submit" id="sendBtn">Send</button>
            </form>
        </div>
    </div>
    <template id="aimsgtemplate">
        <div class="aimsgcard">
            <p class="ainame">Apodex 1.1</p>
            <p class="aimsg">Hi! How can I help you today?</p>
        </div>
    </template>
    <template id="usermsgtemplate">
        <div class="usermsgcard">
            <p class="username">You</p>
            <p class="usermsg">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Reiciendis excepturi, quia ipsum, eveniet quasi iste deleniti incidunt natus, dignissimos accusantium ut mollitia sequi consequatur debitis aspernatur. Aperiam deleniti odio totam.</p>
        </div>
    </template>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/chat.js"></script>
</body>
</html>
